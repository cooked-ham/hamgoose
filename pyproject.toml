# This file mirrors the official Goose custom-extension layout
# (https://goose-docs.ai/docs/tutorials/custom-extensions). hamgoose is a
# standalone MCP server (stdio transport) that Goose discovers and drives.

[project]
name = "hamgoose"
version = "0.2.0"
description = "Factory-Droid-style Mission orchestration extension for Goose"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "cookedham"}]
keywords = ["goose", "mcp", "agent", "orchestration", "extensions", "missions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.25.0,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hamgoose = "hamgoose:main"

[project.urls]
Homepage = "https://github.com/cooked-ham/hamgoose"
Repository = "https://github.com/cooked-ham/hamgoose"
Issues = "https://github.com/cooked-ham/hamgoose/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hamgoose"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "realgoose: real Goose + LLM integration tests (slower; skipped if goose missing)",
]
# HG-17: deterministic runs on Windows. The default temp root
# (…\Temp\pytest-of-<user>) can be permission-broken and error the whole
# session (35 PermissionErrors observed on the dev box); a local basetemp plus
# a writable cache dir make `pytest` work with zero manual flags, CI or local.
addopts = ["--basetemp=.pytest_tmp"]
