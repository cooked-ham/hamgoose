# This file mirrors the official Goose custom-extension layout
# (https://goose-docs.ai/docs/tutorials/custom-extensions). hamgoose is a
# standalone MCP server (stdio transport) that Goose discovers and drives.

[project]
name = "hamgoose"
version = "0.1.0"
description = "Factory-Droid-style Mission orchestration extension for Goose"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.25.0,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hamgoose = "hamgoose:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hamgoose"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "realgoose: real Goose + LLM integration tests (slower; skipped if goose missing)",
]
